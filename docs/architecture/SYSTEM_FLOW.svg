<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2700" viewBox="0 0 1600 2700" role="img" aria-labelledby="title desc">
  <title id="title">Incident Agent workflow</title>
  <desc id="desc">The incident workflow: signed alert, MySQL-backed queue and two workers, bounded evidence gathering, optional OpenAI interpretation, analysis review, versioned draft, exact-draft publication review, local HTML and optional Jira, Slack or GitHub publication.</desc>
  <defs>
    <style>
      .bg{fill:#050505}.card{fill:#f5f3ee;stroke:#bbb8b0;stroke-width:3}.store{fill:#e8f1ff;stroke:#6d9df5;stroke-width:3}.ai{fill:#eceaff;stroke:#7770ea;stroke-width:3}.human{fill:#fff0d5;stroke:#d99020;stroke-width:3}.danger{fill:#ffe9e7;stroke:#e25b52;stroke-width:3}.disabled{fill:#1d1d1d;stroke:#777;stroke-width:3;stroke-dasharray:9 7}.box{rx:22}.h{fill:#383838;font:700 31px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.p{fill:#666;font:400 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.small{fill:#777;font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.light{fill:#aaa;font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.legend{fill:#aaa;font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.line{stroke:#aaa;stroke-width:4;fill:none;marker-end:url(#arrow)}.loop{stroke:#b7b7b7;stroke-width:4;fill:none;marker-end:url(#arrow)}.badline{stroke:#e25b52;stroke-width:4;fill:none;marker-end:url(#badarrow)}.dash{stroke:#888;stroke-width:4;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 Z" fill="#aaa"/></marker>
    <marker id="badarrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 Z" fill="#e25b52"/></marker>
  </defs>

  <rect class="bg" width="1600" height="2700"/>
  <text x="800" y="55" fill="#f5f3ee" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700" text-anchor="middle">Incident Agent — current workflow</text>
  <text x="800" y="85" class="light" text-anchor="middle">MySQL + API + two workers · bounded evidence · two human decisions · optional publishers</text>

  <!-- Intake -->
  <rect class="card box" x="490" y="125" width="620" height="115"/>
  <text class="h" x="800" y="172">Alert webhook (trigger)</text>
  <text class="p" x="800" y="207">signed Grafana/Alertmanager alert · synthetic local canary</text>

  <path class="line" d="M800 240 V295"/>
  <rect class="card box" x="490" y="295" width="620" height="135"/>
  <text class="h" x="800" y="343">validate_intake + normalize</text>
  <text class="p" x="800" y="376">schema · size · HMAC · nonce · rate limit · incident ID</text>
  <text class="small" x="800" y="404">invalid request → 4xx / 429 + redacted audit/metric</text>

  <path class="line" d="M800 430 V485"/>
  <rect class="store box" x="490" y="485" width="620" height="145"/>
  <text class="h" x="800" y="533">persist event + enqueue job</text>
  <text class="p" x="800" y="566">MySQL event + bucketed analysis job in one transaction</text>
  <text class="small" x="800" y="596">all events saved · one pending job + one follow-up · redaction</text>

  <path class="line" d="M800 630 V685"/>
  <rect class="store box" x="490" y="685" width="620" height="125"/>
  <text class="h" x="800" y="733">200 accepted</text>
  <text class="p" x="800" y="766">returns event_id + job_id immediately</text>
  <text class="small" x="800" y="792">model/source latency never keeps webhook open</text>

  <!-- Worker -->
  <path class="line" d="M800 810 V865"/>
  <rect class="store box" x="490" y="865" width="620" height="125"/>
  <text class="h" x="800" y="913">two workers lease + create analysis revision</text>
  <text class="p" x="800" y="946">one MySQL lease owner · checkpoint · lifecycle · run context</text>
  <text class="small" x="800" y="972">transient retry · terminal/exhausted → dead letter</text>

  <!-- Planning -->
  <path class="line" d="M800 990 V1045"/>
  <rect class="card box" x="490" y="1045" width="620" height="118"/>
  <text class="h" x="800" y="1091">ingest_alert → plan_collection</text>
  <text class="p" x="800" y="1124">time window · scope · severity-aware evidence budget</text>

  <!-- Parallel gathering -->
  <path class="line" d="M800 1163 V1210 H300 V1260"/>
  <path class="line" d="M800 1163 V1260"/>
  <path class="line" d="M800 1163 V1210 H1300 V1260"/>
  <rect class="card box" x="105" y="1260" width="390" height="125"/>
  <text class="h" x="300" y="1308">gather_logs</text><text class="p" x="300" y="1340">bounded log query</text><text class="small" x="300" y="1365">fixture/Loki · opt-in CloudWatch API path</text>
  <rect class="card box" x="605" y="1260" width="390" height="125"/>
  <text class="h" x="800" y="1308">gather_metrics</text><text class="p" x="800" y="1340">bounded metric query</text><text class="small" x="800" y="1365">quality + source status</text>
  <rect class="card box" x="1105" y="1260" width="390" height="125"/>
  <text class="h" x="1300" y="1308">gather_deploys</text><text class="p" x="1300" y="1340">recent change context</text><text class="small" x="1300" y="1365">same service + time window</text>

  <!-- Join -->
  <path class="line" d="M300 1385 L720 1460"/><path class="line" d="M800 1385 V1460"/><path class="line" d="M1300 1385 L880 1460"/>
  <rect class="card box" x="490" y="1460" width="620" height="135"/>
  <text class="h" x="800" y="1508">reduce + correlate</text>
  <text class="p" x="800" y="1541">canonical evidence · timeline · grouping · deterministic candidates</text>
  <text class="small" x="800" y="1568">abstain on insufficient evidence · preserve contradictions</text>

  <!-- gather more loop -->
  <path class="loop" d="M1110 1528 H1450 Q1510 1528 1510 1468 V1190 Q1510 1140 1460 1140 H1350"/>
  <text class="light" x="1200" y="1175">↻ loop: expand collection only when justified</text>

  <!-- AI -->
  <path class="line" d="M800 1595 V1650"/>
  <rect class="ai box" x="490" y="1650" width="620" height="135"/>
  <text class="h" x="800" y="1698" fill="#49439e">interpret_incident</text>
  <text class="p" x="800" y="1731" fill="#5550ac">OpenAI only with compose.openai.yaml; selected redacted evidence</text>
  <text class="small" x="800" y="1758">grounding/quality gate · no-cost run uses deterministic fallback</text>

  <!-- Review -->
  <path class="line" d="M800 1785 V1840"/>
  <rect class="human box" x="490" y="1840" width="620" height="145"/>
  <text class="h" x="800" y="1888" fill="#87530e">human_review</text>
  <text class="p" x="800" y="1921" fill="#87530e">pause · approve/reject · pending_revision optimistic lock</text>
  <text class="small" x="800" y="1950">decision, rationale and displayed evidence are persisted</text>

  <!-- Reject loop -->
  <path class="loop" d="M1110 1912 H1375 Q1440 1912 1440 1848 V1718 Q1440 1650 1375 1650 H1120"/>
  <text class="light" x="1200" y="1630">↻ reject: feedback → reinvestigate → new revision</text>

  <!-- Draft + exact publication review -->
  <path class="line" d="M800 1985 V2040"/>
  <rect class="ai box" x="490" y="2040" width="620" height="118"/>
  <text class="h" x="800" y="2086" fill="#49439e">draft_postmortem</text>
  <text class="p" x="800" y="2120" fill="#5550ac">versioned, redacted RCA/postmortem draft</text>

  <path class="line" d="M800 2158 V2205"/>
  <rect class="human box" x="490" y="2205" width="620" height="135"/>
  <text class="h" x="800" y="2253" fill="#87530e">publish_review</text>
  <text class="p" x="800" y="2286" fill="#87530e">approve the exact draft version + SHA-256 digest</text>
  <text class="small" x="800" y="2315">reject → keep versioned draft · approve → guarded publish</text>

  <path class="line" d="M800 2340 V2400"/>
  <rect class="store box" x="490" y="2400" width="620" height="135"/>
  <text class="h" x="800" y="2448">publish</text>
  <text class="p" x="800" y="2481">local HTML + durable at-most-once publication claim</text>
  <text class="small" x="800" y="2510">external master off by default · uncertain write blocks retry</text>

  <path class="dash" d="M1110 2468 H1150"/>
  <rect class="card box" x="1150" y="2385" width="385" height="165"/>
  <text class="h" x="1342" y="2430">opt-in destinations</text>
  <text class="p" x="1342" y="2465">Jira · Slack · GitHub</text>
  <text class="small" x="1342" y="2495">Jira: Rovo MCP createJiraIssue</text>
  <text class="small" x="1342" y="2523">scoped token + fixed site/project/type</text>

  <!-- Failure branch -->
  <path class="badline" d="M490 928 H245 V1015"/>
  <rect class="danger box" x="65" y="1015" width="300" height="115"/>
  <text class="h" x="215" y="1060" fill="#9e342e">dead letter</text>
  <text class="p" x="215" y="1092" fill="#9e342e">redacted diagnostics</text><text class="small" x="215" y="1115">authenticated replay available</text>

  <!-- Permanently excluded authority -->
  <rect class="disabled box" x="65" y="2205" width="300" height="135"/>
  <text x="215" y="2250" fill="#ddd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" text-anchor="middle">Always blocked</text>
  <text class="small" x="215" y="2282" fill="#bbb">automatic approval · remediation</text>
  <text class="small" x="215" y="2310" fill="#bbb">model-selected destination or MCP tool</text>
  <path class="dash" d="M490 2272 H365"/>

  <!-- Observability -->
  <rect class="store box" x="65" y="1610" width="300" height="145"/>
  <text class="h" x="215" y="1655">See the run</text>
  <text class="p" x="215" y="1687">API + worker metrics</text>
  <text class="small" x="215" y="1715">Grafana import after Prometheus</text>
  <text class="small" x="215" y="1740">Phoenix: optional local traces</text>
  <path class="dash" d="M490 1700 H365"/>

  <!-- Legend -->
  <rect class="card box" x="190" y="2630" width="24" height="24"/><text class="legend" x="225" y="2650">deterministic / publisher</text>
  <rect class="store box" x="590" y="2630" width="24" height="24"/><text class="legend" x="625" y="2650">durable state</text>
  <rect class="ai box" x="830" y="2630" width="24" height="24"/><text class="legend" x="865" y="2650">optional LLM stage</text>
  <rect class="human box" x="1120" y="2630" width="24" height="24"/><text class="legend" x="1155" y="2650">human decision</text>
</svg>
