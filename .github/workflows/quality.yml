name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-safe-gate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: incident_agent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CHECKPOINTER: mysql
      PROCESS_ROLE: api
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: incident_agent
      MYSQL_USER: root
      MYSQL_API_USER: root
      MYSQL_MIGRATOR_USER: root
      RUNTIME_SCHEMA_DDL_ENABLED: "false"
      SKIP_LLM: "true"
      OPENAI_API_KEY: test-provider-key
      PUBLISH_EXTERNAL: "false"
      PHOENIX_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.1.2 setuptools==84.0.0
          python -m pip install --require-hashes -r requirements.lock
      - name: Apply and verify MySQL release schema
        env:
          PROCESS_ROLE: migrator
          RUNTIME_SCHEMA_DDL_ENABLED: "false"
        run: |
          python scripts/migrate_database.py apply
          python scripts/migrate_database.py check
      - name: Run deterministic quality gate
        run: python scripts/quality_gate.py
      - name: Exercise four worker processes under load and SIGKILL
        run: python scripts/verify_distributed_runtime.py --jobs 64 --workers 4 | tee distributed-runtime.json
      - name: Repeat distributed race probe
        run: python scripts/run_resilience_soak.py --cycles 2 --jobs-per-cycle 40 --workers 4 | tee resilience-soak.json
      - name: Install MySQL backup client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mysql-client
      - name: Rehearse logical backup and isolated restore
        env:
          PROCESS_ROLE: migrator
        run: python scripts/verify_backup_restore.py | tee backup-restore.json
      - name: Validate deploy artifacts
        run: python scripts/validate_deploy_artifacts.py
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - name: Audit locked dependencies
        run: pip-audit -r requirements.lock --require-hashes
      - uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            .coverage
            sbom.json
            distributed-runtime.json
            resilience-soak.json
            backup-restore.json

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose rendering
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: incident-agent:local
          build-args: |
            BUILD_REVISION=${{ github.sha }}
      - name: Start the local multi-worker stack
        run: docker compose up --no-build --wait
      - name: Run the duplicate-safe E2E canary
        run: docker compose --profile tools run --rm --no-deps verify
      - name: Show Compose status
        if: always()
        run: docker compose ps
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the test stack
        if: always()
        run: docker compose down --volumes
